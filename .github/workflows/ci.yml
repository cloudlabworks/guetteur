name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --require-hashes -r requirements/release.txt
          python -m build --no-isolation
      - name: Wheel carries the vendored verifier and the dashboard
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'guetteur/_vendor/prove_it_done/verify_receipts.py'
          python -m zipfile -l dist/*.whl | grep -q 'guetteur/cloud/dashboard.html'
      - name: Console script runs from the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/wheel-venv/bin/guetteur --help
